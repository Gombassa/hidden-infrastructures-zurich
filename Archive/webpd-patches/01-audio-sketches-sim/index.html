<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Infrastructures: Zürich — Phase 1 Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #080808;
      color: #b0b0b0;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 { color: #e0e0e0; font-size: 15px; letter-spacing: 2px; margin-bottom: 2px; }
    h2 { color: #444; font-size: 11px; margin-bottom: 14px; font-weight: normal; letter-spacing: 1px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .card { background: #111; border: 1px solid #1e1e1e; padding: 10px 12px; }
    .card-label { color: #444; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .card-value { color: #00e87a; font-size: 15px; }
    .card-value.alert { color: #ff6b35; }

    .buttons { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      background: #111;
      color: #888;
      border: 1px solid #2a2a2a;
      padding: 8px 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: border-color 0.15s, color 0.15s;
    }
    button:hover:not(:disabled) { border-color: #555; color: #ccc; }
    button:disabled { color: #333; border-color: #1a1a1a; cursor: not-allowed; }
    button.active { border-color: #00e87a; color: #00e87a; }

    .bottom {
      display: flex;
      gap: 8px;
      height: 320px;
    }
    #map {
      flex: 1;
      border: 1px solid #1e1e1e;
    }
    #log {
      flex: 1;
      background: #050505;
      border: 1px solid #161616;
      overflow-y: auto;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.7;
    }
    .ll   { color: #383838; }
    .lt   { color: #666; }
    .ltrg { color: #ff6b35; font-weight: bold; }
    .lerr { color: #ff4444; }
    .linf { color: #4a90e2; }
    .lok  { color: #00e87a; }

    .map-legend {
      background: rgba(8, 8, 8, 0.88);
      border: 1px solid #1e1e1e;
      padding: 6px 9px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      color: #888;
      line-height: 1.9;
      pointer-events: none;
    }
    .legend-row { display: flex; align-items: center; gap: 7px; }
    .legend-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 1.5px solid;
      flex-shrink: 0;
    }
    .legend-line {
      display: inline-block;
      width: 14px; height: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1>HIDDEN INFRASTRUCTURES: ZÜRICH</h1>
  <h2>phase 1 — real engines → proximity → web audio pipeline test</h2>

  <div class="cards">
    <div class="card">
      <div class="card-label">Listener Position</div>
      <div class="card-value" id="card-pos">—</div>
    </div>
    <div class="card">
      <div class="card-label">Trams within 150m</div>
      <div class="card-value" id="card-trams">—</div>
    </div>
    <div class="card">
      <div class="card-label">Nearest Feeder Dist</div>
      <div class="card-value" id="card-feeder">—</div>
    </div>
  </div>

  <div class="buttons">
    <button id="btn-audio">Unlock Audio</button>
    <button id="btn-start" disabled>Start</button>
    <button id="btn-stop" disabled>Stop</button>
  </div>

  <div class="bottom">
    <div id="map"></div>
    <div id="log"></div>
  </div>

  <script type="module">

    import TramEngine      from '../../src/tram-engine.js';
    import ProximityEngine from '../../src/proximity-engine.js';
    import ListenerEngine  from '../../src/listener-engine.js';

    window._tramEngine      = TramEngine;
    window._proximityEngine = ProximityEngine;

    // ── CONSTANTS ────────────────────────────────────────────────────────────
    const R = 6371000;               // Earth radius in metres
    const TRAM_COUNT_RADIUS_M = 150; // trams within 150m of listener → count
    const TRAM_COLORS = { '2': '#51cf66', '7': '#ff6b6b', '9': '#4a90e2', '11': '#ffd43b', '13': '#cc5de8' };

    // ── HAVERSINE DISTANCE ───────────────────────────────────────────────────
    // Kept for nearest-feeder-dist display card only.
    function haversine(lat1, lng1, lat2, lng2) {
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2
              + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
              * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ── WEB AUDIO SYNTHESIS ──────────────────────────────────────────────────

    // 6 percussive noise bursts scheduled over 300ms via Web Audio API.
    // Bursts spaced 50ms apart; amplitude ramps from 0.1 (hit 1) to 0.6 (hit 6).
    function triggerCrackle(ctx) {
      const burstCount = 6;
      const spacing    = 0.050; // 50ms between burst onsets
      const bufLen     = Math.floor(ctx.sampleRate * 0.020); // 20ms buffer per burst

      for (let i = 0; i < burstCount; i++) {
        const t0        = ctx.currentTime + i * spacing;
        const amplitude = 0.1 + i * 0.1; // 0.1 → 0.6 linear across 6 hits

        const buffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data   = buffer.getChannelData(0);
        for (let s = 0; s < bufLen; s++) data[s] = Math.random() * 2 - 1;

        const source = ctx.createBufferSource();
        source.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1200;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(amplitude, t0 + 0.002); // 2ms attack
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.012); // 10ms decay

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start(t0);
        source.stop(t0 + 0.020);
      }
    }

    // Two detuned oscillators (220 + 221 Hz) with amplitude driven by tram count.
    // Called once on unlock; returns the GainNode so gain can be updated each tick.
    function startDrone(ctx) {
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      osc1.frequency.value = 110;
      osc2.frequency.value = 112;

      const gain = ctx.createGain();
      gain.gain.value = 0.1;

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      osc1.start();
      osc2.start();

      return gain;
    }

    // Pool of 5 looping noise nodes for continuous idle feeder texture.
    // Each node: BufferSource (loop) → BiquadFilter highpass 1200Hz → GainNode.
    // Assigned to the nearest feeders within 15m each tick; gain = (1 - dist/15) * 0.15.
    function initIdlePool(ctx) {
      const pool = [];
      const bufLen = ctx.sampleRate * 2; // 2s loop buffer (long enough to hide the loop point)
      for (let i = 0; i < 5; i++) {
        const buffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data   = buffer.getChannelData(0);
        for (let s = 0; s < bufLen; s++) data[s] = Math.random() * 2 - 1;

        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.loop   = true;

        const filter = ctx.createBiquadFilter();
        filter.type  = 'highpass';
        filter.frequency.value = 1200;

        const gain = ctx.createGain();
        gain.gain.value = 0;

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start();

        pool.push({ source, filter, gain });
      }
      return pool;
    }

    // ── MAP ──────────────────────────────────────────────────────────────────
    let map            = null;
    let listenerMarker = null;
    let feederMarkers  = null; // Map<id, L.CircleMarker>
    let tramMarkerPool = null; // Array<L.CircleMarker>, fixed pool of 10

    function initMap() {
      map = L.map('map').setView([47.3693, 8.5411], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);

      // Route polyline — waypoints are [lng, lat] (GeoJSON), Leaflet needs [lat, lng]
      const routeLatLngs = ListenerEngine.waypoints.map(([lng, lat]) => [lat, lng]);
      L.polyline(routeLatLngs, { color: '#4a90e2', weight: 2, opacity: 0.7 }).addTo(map);

      // Feeder markers — calculate with no trams to get all positions
      const initialProximity = ProximityEngine.calculate({ trams: [] });
      feederMarkers = new Map();
      for (const feeder of initialProximity.feeders) {
        const marker = L.circleMarker([feeder.lat, feeder.lng], {
          radius: 3,
          color: '#333',
          fillColor: '#444',
          fillOpacity: 1,
          weight: 1,
        }).addTo(map);
        feederMarkers.set(feeder.id, marker);
      }

      // Tram marker pool — 10 slots, shown/hidden based on active tram count
      tramMarkerPool = [];
      for (let i = 0; i < 10; i++) {
        tramMarkerPool.push(L.circleMarker([47.37, 8.54], {
          radius: 5,
          color: '#fff',
          fillColor: '#888',
          fillOpacity: 0,
          opacity: 0,
          weight: 1.5,
        }).addTo(map));
      }

      // Listener marker — starts at Stadelhofen
      listenerMarker = L.circleMarker([47.3664, 8.5483], {
        radius: 7,
        color: '#cccccc',
        fillColor: '#ffffff',
        fillOpacity: 0.9,
        weight: 2,
      }).addTo(map);

      // Legend control
      const legend = L.control({ position: 'bottomleft' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'map-legend');
        div.innerHTML =
          '<div class="legend-row"><span class="legend-dot" style="background:#444;border-color:#333"></span>feeder inactive</div>' +
          '<div class="legend-row"><span class="legend-dot" style="background:#ff6b35;border-color:#ff6b35"></span>feeder active (listener &lt;15m + tram &lt;20m)</div>' +
          '<div class="legend-row"><span class="legend-line" style="background:#4a90e2"></span>route: Stadelhofen → Bürkliplatz</div>' +
          '<div class="legend-row"><span class="legend-dot" style="background:#fff;border-color:#ccc"></span>listener</div>' +
          '<div class="legend-row"><span class="legend-dot" style="background:#51cf66;border-color:#fff"></span>tram line 2</div>' +
          '<div class="legend-row"><span class="legend-dot" style="background:#ff6b6b;border-color:#fff"></span>tram line 7</div>' +
          '<div class="legend-row"><span class="legend-dot" style="background:#4a90e2;border-color:#fff"></span>tram line 9</div>' +
          '<div class="legend-row"><span class="legend-dot" style="background:#ffd43b;border-color:#fff"></span>tram line 11</div>' +
          '<div class="legend-row"><span class="legend-dot" style="background:#cc5de8;border-color:#fff"></span>tram line 13</div>';
        return div;
      };
      legend.addTo(map);

      appendLog(`Map ready — ${initialProximity.feeders.length} feeders, ${routeLatLngs.length} waypoints`, 'lok');
    }

    // ── STATE ────────────────────────────────────────────────────────────────
    let ctx       = null;
    let droneGain = null;
    let idlePool  = null; // 5-node looping noise pool for idle feeder texture
    let tick      = 0;

    // ── UI HELPERS ───────────────────────────────────────────────────────────
    const logDiv = document.getElementById('log');

    function appendLog(text, cls = 'll') {
      const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const el = document.createElement('div');
      el.className = cls;
      el.textContent = `[${ts}] ${text}`;
      logDiv.appendChild(el);
      if (logDiv.children.length > 500) logDiv.removeChild(logDiv.firstChild);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setCard(id, value, alert = false) {
      const el = document.getElementById(id);
      el.textContent = value;
      el.className = `card-value${alert ? ' alert' : ''}`;
    }

    // ── ENGINE TICK ──────────────────────────────────────────────────────────
    // Fires every 1s while ListenerEngine is running.
    ListenerEngine.onUpdate((listenerState) => {
      console.log('onUpdate fired', listenerState);
      tick++;

      const tramState  = TramEngine.getState();
      const proximity  = ProximityEngine.calculate(tramState, listenerState.lat, listenerState.lng);

      // Trams within 150m of listener
      const tramCount = TramEngine
        .getDistanceToPoint(listenerState.lat, listenerState.lng)
        .filter(t => t.distance < TRAM_COUNT_RADIUS_M).length;

      console.table(proximity.feeders.slice(0, 3).map(f => ({
        id: f.id,
        triggered: f.triggered,
        dist: Math.round(haversine(listenerState.lat, listenerState.lng, f.lat, f.lng)),
      })));

      // Feeder triggers
      const triggeredFeeders = proximity.feeders.filter(f => f.triggered);
      const feederTriggered  = triggeredFeeders.length > 0;

      // Nearest tram-to-feeder distance (for display card)
      let nearestFeederDist = Infinity;
      for (const feeder of proximity.feeders) {
        for (const tram of tramState.trams) {
          const d = haversine(feeder.lat, feeder.lng, tram.lat, tram.lng);
          if (d < nearestFeederDist) nearestFeederDist = d;
        }
      }

      // ── Audio ──
      if (ctx) {
        // Active crackle: listener within 15m of a feeder AND tram within 20m
        if (feederTriggered) triggerCrackle(ctx);

        // Drone: amplitude driven by tram count near listener
        if (droneGain) droneGain.gain.value = tramCount / 5 + 0.1;

        // Idle feeder texture: assign pool nodes to nearest feeders within 15m
        if (idlePool) {
          const nearbyFeeders = proximity.feeders
            .map(f => ({ f, dist: haversine(listenerState.lat, listenerState.lng, f.lat, f.lng) }))
            .filter(({ dist }) => dist < 15)
            .sort((a, b) => a.dist - b.dist)
            .slice(0, idlePool.length);

          for (let i = 0; i < idlePool.length; i++) {
            if (i < nearbyFeeders.length) {
              idlePool[i].gain.gain.value = (1 - nearbyFeeders[i].dist / 15) * 0.15;
            } else {
              idlePool[i].gain.gain.value = 0;
            }
          }
        }
      }

      // ── Map ──
      if (listenerMarker) {
        listenerMarker.setLatLng([listenerState.lat, listenerState.lng]);
        map.setView([listenerState.lat, listenerState.lng], 17);
      }
      if (feederMarkers) {
        for (const feeder of proximity.feeders) {
          const marker = feederMarkers.get(feeder.id);
          if (!marker) continue;
          if (feeder.triggered) {
            marker.setStyle({ color: '#ff6b35', fillColor: '#ff6b35' });
          } else {
            marker.setStyle({ color: '#333', fillColor: '#444' });
          }
        }
      }

      // ── UI cards ──
      setCard('card-pos',    `${listenerState.lat.toFixed(4)}, ${listenerState.lng.toFixed(4)}`);
      setCard('card-trams',  String(tramCount), tramCount > 0);
      setCard('card-feeder',
        nearestFeederDist === Infinity ? '—' : `${Math.round(nearestFeederDist)}m`,
        feederTriggered,
      );

      // ── Log ──
      if (feederTriggered) {
        appendLog(
          `TICK ${String(tick).padStart(3)} | ⚡ FEEDER TRIGGER (${triggeredFeeders.map(f => f.id).join(', ')}) | trams:${tramCount} | nearest:${Math.round(nearestFeederDist)}m`,
          'ltrg',
        );
      } else {
        appendLog(
          `TICK ${String(tick).padStart(3)} | ${listenerState.nearestStop} | trams:${tramCount} | nearest:${nearestFeederDist === Infinity ? '—' : Math.round(nearestFeederDist) + 'm'}`,
          'lt',
        );
      }
    });

    // ── TRAM MARKER UPDATES ──────────────────────────────────────────────────
    TramEngine.onUpdate((tramState) => {
      console.log('[TramEngine.onUpdate] trams:', tramState.trams.length, tramState.trams.map(t => ({ line: t.line, lat: t.lat, lng: t.lng })));
      if (!tramMarkerPool) return;
      const trams = tramState.trams.slice(0, tramMarkerPool.length);
      for (let i = 0; i < tramMarkerPool.length; i++) {
        const m = tramMarkerPool[i];
        if (i < trams.length) {
          const tram = trams[i];
          const color = TRAM_COLORS[String(tram.line)] || '#aaaaaa';
          m.setLatLng([tram.lat, tram.lng]);
          m.setStyle({ fillColor: color, color: '#fff', fillOpacity: 0.9, opacity: 1 });
        } else {
          m.setStyle({ fillOpacity: 0, opacity: 0 });
        }
      }
    });

    // ── BUTTONS ──────────────────────────────────────────────────────────────
    const btnAudio = document.getElementById('btn-audio');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');

    btnAudio.addEventListener('click', async () => {
      btnAudio.disabled = true;
      btnAudio.textContent = 'Loading…';
      try {
        appendLog('Initialising engines…', 'linf');
        await Promise.all([
          ProximityEngine.init('/data/processed/substations.geojson', '/data/raw/route-tram-feeders.geojson'),
          ListenerEngine.init('/data/processed/route-waypoints.json'),
        ]);
        const listenerState = ListenerEngine.getState();
        appendLog(`ProximityEngine ready`, 'lok');
        appendLog(`ListenerEngine ready — ${listenerState.totalDistance}m route, ${ListenerEngine.waypoints.length} waypoints`, 'lok');

        initMap();

        ctx = new AudioContext();
        window._ctx = ctx;
        if (ctx.state === 'suspended') await ctx.resume();
        appendLog(`AudioContext running (${ctx.sampleRate} Hz)`, 'linf');

        btnAudio.textContent = 'Audio Active';
        btnAudio.classList.add('active');
        btnStart.disabled = false;
      } catch (e) {
        appendLog(`ERROR: ${e.message}`, 'lerr');
        console.error(e);
        btnAudio.disabled = false;
        btnAudio.textContent = 'Unlock Audio';
      }
    });

    btnStart.addEventListener('click', () => {
      droneGain = startDrone(ctx);
      appendLog('Drone oscillators started (110 + 112 Hz)', 'lok');
      if (!idlePool) {
        idlePool = initIdlePool(ctx);
        appendLog('Idle feeder texture pool ready (5 nodes)', 'lok');
      }
      TramEngine.start();
      ListenerEngine.start();
      btnStart.disabled = true;
      btnStart.classList.add('active');
      btnStop.disabled = false;
      appendLog('Engines started — TramEngine polling every 10s, ListenerEngine walking at 5 km/h', 'lok');
    });

    btnStop.addEventListener('click', () => {
      TramEngine.stop();
      ListenerEngine.stop();
      if (droneGain) { droneGain.gain.value = 0; droneGain = null; }
      if (idlePool) idlePool.forEach(node => { node.gain.gain.value = 0; });
      btnStart.disabled = false;
      btnStart.classList.remove('active');
      btnStop.disabled = true;
      appendLog('Engines stopped', 'linf');
    });

    // ── STARTUP ───────────────────────────────────────────────────────────────
    appendLog('Real engines: TramEngine + ProximityEngine + ListenerEngine', 'linf');
    appendLog('Tram count radius: 150m | Feeder hiss: listener <15m | Feeder event: listener <15m + tram <20m | Route: 75 waypoints (2,682m)', 'linf');
    appendLog('Spatial audio: PannerNode (Web Audio API) — Phase 1', 'linf');
    appendLog('Unlock Audio → Start to begin.', 'll');
  </script>
</body>
</html>
