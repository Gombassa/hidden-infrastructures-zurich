# NOTE: the values hardcoded below (service "hidden-infrastructures", region europe-west6)
# are NOT what actually deploys. The wired-up Cloud Build trigger (Gombassa/hidden-infrastructures-zurich,
# branch ^main$, trigger ID 8705f554-1fe5-439c-955f-...) overrides via console-side substitution
# variables (_SERVICE_NAME, _DEPLOY_REGION, etc.) that this file does not reference. That trigger
# config is the source of truth for the real deploy target, not this file.
steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'europe-west6-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hidden-infrastructures:$COMMIT_SHA'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'europe-west6-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hidden-infrastructures:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hidden-infrastructures
      - '--image=europe-west6-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hidden-infrastructures:$COMMIT_SHA'
      - '--region=europe-west6'
      - '--allow-unauthenticated'
      - '--port=8080'

images:
  - 'europe-west6-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hidden-infrastructures:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
