<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Infrastructures: Zürich — Phase 1 Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #080808;
      color: #ffffff;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 { color: #ffffff; font-size: 15px; letter-spacing: 2px; margin-bottom: 14px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .card { background: #111; border: 1px solid #1e1e1e; padding: 10px 12px; }
    .card-label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .card-value { color: #00e87a; font-size: 15px; }
    .card-value.alert { color: #ff6b35; }

    .buttons { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      background: #111;
      color: #ffffff;
      border: 1px solid #2a2a2a;
      padding: 8px 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: border-color 0.15s, color 0.15s;
    }
    button:hover:not(:disabled) { border-color: #555; color: #ffffff; }
    button:disabled { color: #333; border-color: #1a1a1a; cursor: not-allowed; }
    button.active { border-color: #00e87a; color: #00e87a; }

    #map {
      width: 100%;
      height: 400px;
      border: 1px solid #1e1e1e;
      margin-bottom: 10px;
    }
    #log {
      width: 100%;
      height: 300px;
      background: #050505;
      border: 1px solid #161616;
      overflow-y: auto;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.7;
    }
    .ll   { color: #fff; }
    .lt   { color: #ffffff; }
    .ltrg { color: #ff6b35; font-weight: bold; }
    .lerr { color: #ff4444; }
    .linf { color: #4a90e2; }
    .lok  { color: #00e87a; }

    .layer-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .layer-btn {
      background: #111;
      border: 1px solid #2a2a2a;
      color: #333;
      padding: 6px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: border-color 0.15s, color 0.15s;
    }
    .layer-btn.on { /* color set inline per layer */ }
  </style>
</head>
<body>

  <h1>HIDDEN INFRASTRUCTURES: ZÜRICH</h1>

  <div class="cards">
    <div class="card">
      <div class="card-label">Listener Position</div>
      <div class="card-value" id="card-pos">—</div>
    </div>
    <div class="card">
      <div class="card-label">Trams within 150m</div>
      <div class="card-value" id="card-trams">—</div>
    </div>
    <div class="card">
      <div class="card-label">Nearest Feeder Dist</div>
      <div class="card-value" id="card-feeder">—</div>
    </div>
  </div>

  <div class="buttons">
    <button id="btn-audio">Unlock Audio</button>
    <button id="btn-start" disabled>Start</button>
    <button id="btn-stop" disabled>Stop</button>
  </div>

  <div class="layer-toggles">
    <button id="toggle-tram"        class="layer-btn on" style="border-color:#ff9f43;color:#ff9f43">TRAM</button>
    <button id="toggle-water"       class="layer-btn on" style="border-color:#4a90e2;color:#4a90e2">WATER</button>
    <button id="toggle-sewage"      class="layer-btn on" style="border-color:#a0855b;color:#a0855b">SEWAGE</button>
    <button id="toggle-electricity" class="layer-btn on" style="border-color:#ffd43b;color:#ffd43b">ELECTRICITY</button>
    <button id="toggle-telecom"     class="layer-btn on" style="border-color:#cc5de8;color:#cc5de8">TELECOM</button>
    <button id="toggle-fernwaerme"  class="layer-btn on" style="border-color:#ff6b35;color:#ff6b35">FERNWÄRME</button>
  </div>
  <div id="map"></div>
  <div id="log"></div>

  <script type="module">

    import TramEngine      from './src/tram-engine.js';
    import ProximityEngine from './src/proximity-engine.js';
    import AudioLayers     from './src/audio-layers.js';

    window._tramEngine      = TramEngine;
    window._proximityEngine = ProximityEngine;

    // ── CONSTANTS ────────────────────────────────────────────────────────────
    const TRAM_COLORS = { '2': '#51cf66', '7': '#ff6b6b', '9': '#4a90e2', '11': '#ffd43b', '13': '#cc5de8' };

    // ── LAYER COLORS (shared by toggles + overlays) ──────────────────────────
    const LAYER_COLORS = {
      tram:        '#ff9f43',
      water:       '#4a90e2',
      sewage:      '#a0855b',
      electricity: '#ffd43b',
      telecom:     '#cc5de8',
      fernwaerme:  '#ff6b35',
    };

    // ── MAP ──────────────────────────────────────────────────────────────────
    let map            = null;
    let listenerMarker = null;
    let feederMarkers  = null; // Map<id, L.CircleMarker>
    let tramMarkerPool = null; // Array<L.CircleMarker>, fixed pool of 10
    let overlayGroups  = null; // { [layer]: L.LayerGroup } — triggered-feature debug markers

    function initMap() {
      map = L.map('map').setView([47.3693, 8.5411], 14);

      L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg', {
        attribution: '© <a href="https://www.swisstopo.admin.ch/">swisstopo</a>',
        maxZoom: 18,
      }).addTo(map);

      // Route polyline — loaded directly from GeoJSON; waypoints are [lng, lat]
      fetch('/data/processed/route-waypoints.json')
        .then(r => r.json())
        .then(data => {
          const routeLatLngs = data.waypoints.map(([lng, lat]) => [lat, lng]);
          L.polyline(routeLatLngs, { color: '#4a90e2', weight: 2, opacity: 0.7 }).addTo(map);
          appendLog(`Route polyline loaded — ${routeLatLngs.length} waypoints`, 'lok');
        })
        .catch(e => appendLog(`Route load failed: ${e.message}`, 'lerr'));

      // Feeder markers — calculate with no trams to get all positions
      const initialProximity = ProximityEngine.calculate({ trams: [] }, realLat, realLng, realHeading, realSpeed);
      feederMarkers = new Map();
      for (const feeder of initialProximity.feeders) {
        const marker = L.circleMarker([feeder.lat, feeder.lng], {
          radius: 3,
          color: '#333',
          fillColor: '#444',
          fillOpacity: 1,
          weight: 1,
        }).addTo(map);
        feederMarkers.set(feeder.id, marker);
      }

      // Tram marker pool — 10 slots, shown/hidden based on active tram count
      tramMarkerPool = [];
      for (let i = 0; i < 10; i++) {
        tramMarkerPool.push(L.circleMarker([47.37, 8.54], {
          radius: 5,
          color: '#fff',
          fillColor: '#888',
          fillOpacity: 0,
          opacity: 0,
          weight: 1.5,
        }).addTo(map));
      }

      // Listener marker — starts at Stadelhofen
      listenerMarker = L.circleMarker([47.3693, 8.5411], {
        radius: 8,
        color: '#ff0000',
        fillColor: '#ff0000',
        fillOpacity: 0.9,
        weight: 2,
      }).addTo(map);

      // Triggered-feature overlay groups — one per audio layer, dev tool only
      overlayGroups = Object.fromEntries(
        Object.keys(LAYER_COLORS).map(k => [k, L.layerGroup().addTo(map)])
      );

      appendLog(`Map ready — ${initialProximity.feeders.length} feeders`, 'lok');

      // Real GPS — centre map on actual device position
      if (navigator.geolocation) {
        gpsWatcherId = navigator.geolocation.watchPosition(
          (pos) => {
            // ── TEST LOCATION OVERRIDE ───────────────────────────────────────
            // To activate: uncomment the two override lines, comment out the two real lines.
            // Paradeplatz (west end of route, dense water/elec/telecom infrastructure):
            // pos = { coords: { latitude: 47.3707, longitude: 8.5384, speed: null, accuracy: 1 } };
            // Stadelhofen (east end, tram-dense terminus):
            // pos = { coords: { latitude: 47.3769, longitude: 8.5417, speed: null, accuracy: 1 } };
            // ────────────────────────────────────────────────────────────────
            realLat   = pos.coords.latitude;
            realLng   = pos.coords.longitude;
            realSpeed = pos.coords.speed; // m/s, or null if unavailable
            setCard('card-pos', `${realLat.toFixed(5)}, ${realLng.toFixed(5)} | ${realHeading !== null ? realHeading.toFixed(1) + '°' : '—'}`);
            appendLog(`[GPS] ${realLat} ${realLng} accuracy: ${pos.coords.accuracy}`, 'll');
            if (listenerMarker) listenerMarker.setLatLng([realLat, realLng]);
            if (following && map) map.setView([realLat, realLng], 19);
            if (pos.coords.accuracy <= 50) {
              AudioLayers.onListenerMove(realLat, realLng, realHeading);
            }
          },
          (err) => appendLog(`GPS error: ${err.message}`, 'lerr'),
          { enableHighAccuracy: true, maximumAge: 5000 },
        );
      } else {
        appendLog('Geolocation not available — using simulated position', 'linf');
      }
      window.addEventListener('deviceorientation', (event) => {
        if (event.alpha !== null) {
          realHeading = event.alpha;
          if (ctx && ctx.listener) {
            const headingRad = event.alpha * Math.PI / 180;
            const fx = -Math.sin(headingRad);
            const fz = -Math.cos(headingRad);
            ctx.listener.forwardX.setTargetAtTime(fx, ctx.currentTime, 0.1);
            ctx.listener.forwardY.setTargetAtTime(0,  ctx.currentTime, 0.1);
            ctx.listener.forwardZ.setTargetAtTime(fz, ctx.currentTime, 0.1);
            ctx.listener.upX.setTargetAtTime(0, ctx.currentTime, 0.1);
            ctx.listener.upY.setTargetAtTime(1, ctx.currentTime, 0.1);
            ctx.listener.upZ.setTargetAtTime(0, ctx.currentTime, 0.1);
          }
        }
      });
    }

    // ── STATE ────────────────────────────────────────────────────────────────
    let ctx             = null;
    let tick            = 0;
    let firstTickLogged = false;
    let realLat         = null;
    let realLng         = null;
    let realHeading     = null;
    let realSpeed       = null;
    let following       = false;
    let gpsWatcherId    = null;

    // ── UI HELPERS ───────────────────────────────────────────────────────────
    const logDiv = document.getElementById('log');

    function appendLog(text, cls = 'll') {
      const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const el = document.createElement('div');
      el.className = cls;
      el.textContent = `[${ts}] ${text}`;
      logDiv.appendChild(el);
      if (logDiv.children.length > 500) logDiv.removeChild(logDiv.firstChild);
      logDiv.scrollTop = logDiv.scrollHeight;
    }
    window.appendLog = appendLog;

    function setCard(id, value, alert = false) {
      const el = document.getElementById(id);
      el.textContent = value;
      el.className = `card-value${alert ? ' alert' : ''}`;
    }

    // ── TRIGGERED-FEATURE OVERLAYS ───────────────────────────────────────────
    function _updateTriggerOverlays(proximity) {
      if (!overlayGroups || !map) return;
      const dot = (lat, lng, color) => L.circleMarker([lat, lng], {
        radius: 5, color, fillColor: color, fillOpacity: 0.85, weight: 1,
      });
      const pt  = f => [f.lat,    f.lng];
      const mid = f => [f.midLat, f.midLng];

      overlayGroups.tram.clearLayers();
      if (AudioLayers.LAYER_ENABLED.tram)
        for (const f of proximity.feeders.filter(f => f.triggered))
          dot(...pt(f), LAYER_COLORS.tram).addTo(overlayGroups.tram);

      overlayGroups.water.clearLayers();
      if (AudioLayers.LAYER_ENABLED.water) {
        for (const f of (proximity.water?.pipes    || []).filter(f => f.triggered)) dot(...mid(f), LAYER_COLORS.water).addTo(overlayGroups.water);
        for (const f of (proximity.water?.fittings || []).filter(f => f.triggered)) dot(...pt(f),  LAYER_COLORS.water).addTo(overlayGroups.water);
      }

      overlayGroups.sewage.clearLayers();
      if (AudioLayers.LAYER_ENABLED.sewage)
        for (const f of (proximity.sewage?.pipes || []).filter(f => f.triggered))
          dot(...mid(f), LAYER_COLORS.sewage).addTo(overlayGroups.sewage);

      overlayGroups.electricity.clearLayers();
      if (AudioLayers.LAYER_ENABLED.electricity) {
        for (const f of (proximity.electricity?.nodes  || []).filter(f => f.triggered)) dot(...pt(f),  LAYER_COLORS.electricity).addTo(overlayGroups.electricity);
        for (const f of (proximity.electricity?.cables || []).filter(f => f.triggered)) dot(...mid(f), LAYER_COLORS.electricity).addTo(overlayGroups.electricity);
      }

      overlayGroups.telecom.clearLayers();
      if (AudioLayers.LAYER_ENABLED.telecom) {
        for (const f of (proximity.telecom?.nodes  || []).filter(f => f.triggered)) dot(...pt(f),  LAYER_COLORS.telecom).addTo(overlayGroups.telecom);
        for (const f of (proximity.telecom?.cables || []).filter(f => f.triggered)) dot(...mid(f), LAYER_COLORS.telecom).addTo(overlayGroups.telecom);
      }

      overlayGroups.fernwaerme.clearLayers();
      if (AudioLayers.LAYER_ENABLED.fernwaerme)
        for (const f of (proximity.fernwaerme?.pipes || []).filter(f => f.triggered))
          dot(...mid(f), LAYER_COLORS.fernwaerme).addTo(overlayGroups.fernwaerme);
    }

    // ── TRAM MARKER UPDATES ──────────────────────────────────────────────────
    TramEngine.onUpdate((tramState) => {
      if (!tramMarkerPool) return;
      const trams = tramState.trams.slice(0, tramMarkerPool.length);
      for (let i = 0; i < tramMarkerPool.length; i++) {
        const m = tramMarkerPool[i];
        if (i < trams.length) {
          const tram = trams[i];
          const color = TRAM_COLORS[String(tram.line)] || '#aaaaaa';
          m.setLatLng([tram.lat, tram.lng]);
          m.setStyle({ fillColor: color, color: '#fff', fillOpacity: 0.9, opacity: 1 });
        } else {
          m.setStyle({ fillOpacity: 0, opacity: 0 });
        }
      }

      const tramCount = tramState.trams.length;
      setCard('card-trams', String(tramCount), tramCount > 0);

      // Update feeder colours based purely on tram proximity (no listener required)
      if (feederMarkers) {
        const proximity = ProximityEngine.calculate(tramState, realLat, realLng, realHeading, realSpeed);
        {
          const _nd = (arr) => { if (!arr?.length) return '—'; let m = Infinity; for (const it of arr) if (it.dist < m) m = it.dist; return m === Infinity ? '—' : Math.round(m) + 'm'; };
          const _tr = (arr) => arr?.filter(i => i.triggered).length ?? 0;
          const _lat = realLat !== null ? realLat.toFixed(5) : 'null';
          const _lng = realLng !== null ? realLng.toFixed(5) : 'null';
          appendLog(
            `[PROXIMITY] lat: ${_lat} lng: ${_lng}` +
            ` | trams: ${tramState.trams.length} feeders: ${_tr(proximity.feeders)}` +
            ` | water pipes: ${_nd(proximity.water?.pipes)}/${_tr(proximity.water?.pipes)}` +
            ` sewage: ${_nd(proximity.sewage?.pipes)}/${_tr(proximity.sewage?.pipes)}` +
            ` elec: ${_nd([...(proximity.electricity?.nodes??[]), ...(proximity.electricity?.cables??[])])}/${_tr(proximity.electricity?.nodes) + _tr(proximity.electricity?.cables)}` +
            ` telecom: ${_nd([...(proximity.telecom?.nodes??[]), ...(proximity.telecom?.cables??[])])}/${_tr(proximity.telecom?.nodes) + _tr(proximity.telecom?.cables)}` +
            ` fernw: ${_nd(proximity.fernwaerme?.pipes)}/${_tr(proximity.fernwaerme?.pipes)}`,
            'll'
          );
        }
        if (!firstTickLogged) {
          firstTickLogged = true;
          const nd = (arr) => { if (!arr?.length) return '—'; let m = Infinity; for (const it of arr) if (it.dist < m) m = it.dist; return m + 'm'; };
          const tr = (arr) => arr?.filter(i => i.triggered).length ?? 0;
          appendLog('[FIRST TICK] ── proximity snapshot ──', 'linf');
          appendLog(`  listener: ${realLat !== null ? realLat.toFixed(5)+', '+realLng.toFixed(5) : 'null (no GPS yet)'} | trams: ${tramState.trams.length}`, 'linf');
          appendLog(`  powerline (drone): ${proximity.nearestPowerlineDist !== null ? Math.round(proximity.nearestPowerlineDist)+'m' : 'null'}`, 'linf');
          appendLog(`  water  pipes: ${proximity.water.pipes.length} (nearest ${nd(proximity.water.pipes)}, ${tr(proximity.water.pipes)} triggered) | fittings: ${proximity.water.fittings.length} (nearest ${nd(proximity.water.fittings)}, ${tr(proximity.water.fittings)} triggered)`, 'linf');
          appendLog(`  sewage pipes: ${proximity.sewage.pipes.length} (nearest ${nd(proximity.sewage.pipes)}, ${tr(proximity.sewage.pipes)} triggered)`, 'linf');
          appendLog(`  elec   nodes: ${proximity.electricity.nodes.length} (nearest ${nd(proximity.electricity.nodes)}, ${tr(proximity.electricity.nodes)} triggered) | cables: ${proximity.electricity.cables.length} (nearest ${nd(proximity.electricity.cables)}, ${tr(proximity.electricity.cables)} triggered)`, 'linf');
          appendLog(`  telecom nodes: ${proximity.telecom.nodes.length} (nearest ${nd(proximity.telecom.nodes)}, ${tr(proximity.telecom.nodes)} triggered) | cables: ${proximity.telecom.cables.length} (nearest ${nd(proximity.telecom.cables)}, ${tr(proximity.telecom.cables)} triggered)`, 'linf');
          appendLog(`  fernwärme pipes: ${proximity.fernwaerme.pipes.length} (nearest ${nd(proximity.fernwaerme.pipes)}, ${tr(proximity.fernwaerme.pipes)} triggered)`, 'linf');
        }
        for (const feeder of proximity.feeders) {
          const marker = feederMarkers.get(feeder.id);
          if (!marker) continue;
          marker.setStyle(feeder.triggered
            ? { color: '#ff6b35', fillColor: '#ff6b35' }
            : { color: '#333',    fillColor: '#444'    }
          );
        }
        const feederTriggered = proximity.feeders.some(f => f.triggered);
        let nearestFeederDist = Infinity;
        if (realLat !== null && realLng !== null) {
          for (const f of proximity.feeders) {
            const dlat = (f.lat - realLat) * 111320;
            const dlng = (f.lng - realLng) * 111320 * Math.cos(realLat * Math.PI / 180);
            const d = Math.sqrt(dlat * dlat + dlng * dlng);
            if (d < nearestFeederDist) nearestFeederDist = d;
          }
        }
        setCard('card-feeder',
          nearestFeederDist === Infinity ? '—' : `${Math.round(nearestFeederDist)}m`,
          feederTriggered
        );
        if (ctx) AudioLayers.update(proximity, realLat, realLng, realHeading);
        _updateTriggerOverlays(proximity);
      }
    });

    // ── BUTTONS ──────────────────────────────────────────────────────────────
    const btnAudio = document.getElementById('btn-audio');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');

    btnAudio.addEventListener('click', async () => {
      btnAudio.disabled = true;
      btnAudio.textContent = 'Loading…';
      try {
        appendLog('Initialising engines…', 'linf');
        await ProximityEngine.init();
        appendLog(`ProximityEngine ready`, 'lok');

        initMap();

        ctx = new AudioContext();
        window._ctx = ctx;
        if (ctx.state === 'suspended') await ctx.resume();
        appendLog(`AudioContext running (${ctx.sampleRate} Hz)`, 'linf');

        btnAudio.textContent = 'Audio Active';
        btnAudio.classList.add('active');
        btnStart.disabled = false;
      } catch (e) {
        appendLog(`ERROR: ${e.message}`, 'lerr');
        console.error(e);
        btnAudio.disabled = false;
        btnAudio.textContent = 'Unlock Audio';
      }
    });

    btnStart.addEventListener('click', () => {
      AudioLayers.init(ctx);
      appendLog('AudioLayers ready (tram / water / sewage / elec / telecom / fernwärme)', 'lok');
      TramEngine.start();
      following = true;
      btnStart.disabled = true;
      btnStart.classList.add('active');
      btnStop.disabled = false;
      appendLog('Engines started — TramEngine polling every 10s', 'lok');
    });

    btnStop.addEventListener('click', () => {
      TramEngine.stop();
      following = false;
      if (gpsWatcherId !== null) {
        navigator.geolocation.clearWatch(gpsWatcherId);
        gpsWatcherId = null;
      }
      AudioLayers.stop();
      btnStart.disabled = false;
      btnStart.classList.remove('active');
      btnStop.disabled = true;
      appendLog('Engines stopped', 'linf');
    });

    // ── LAYER TOGGLES ────────────────────────────────────────────────────────
    for (const [key, color] of Object.entries(LAYER_COLORS)) {
      const btn = document.getElementById(`toggle-${key}`);
      btn.addEventListener('click', () => {
        AudioLayers.setLayerEnabled(key, !AudioLayers.LAYER_ENABLED[key]);
        const on = AudioLayers.LAYER_ENABLED[key];
        btn.style.borderColor = on ? color : '#2a2a2a';
        btn.style.color       = on ? color : '#333';
        btn.classList.toggle('on', on);
        if (overlayGroups?.[key] && !on) overlayGroups[key].clearLayers();
        appendLog(`[TOGGLE] ${key} ${on ? 'ON' : 'OFF'}`, 'linf');
      });
    }

    // ── TRAM ERROR SURFACE ────────────────────────────────────────────────────
    window.addEventListener('tram-error', (e) => appendLog(e.detail, 'lerr'));

    // ── STARTUP ───────────────────────────────────────────────────────────────
    appendLog('Real engines: TramEngine + ProximityEngine', 'linf');
    appendLog('Tram: feeder 50m | trasse drone 5m | Water: pipe 50m / fitting 25m | Sewage: 80m', 'linf');
    appendLog('Electricity: node 40m / cable 40m | Telecom: node 40m / cable 30m | Fernwärme: 60m', 'linf');
    appendLog('Spatial audio: PannerNode (Web Audio API) — Phase 2', 'linf');
    appendLog('Unlock Audio → Start to begin.', 'll');
  </script>
</body>
</html>
