gzip on;
gzip_types application/geo+json application/json;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Required for AudioWorklet + SharedArrayBuffer
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "credentialless";

    # GeoJSON — explicit MIME type (not in nginx default mime.types)
    location ~* \.geojson$ {
        types { application/geo+json geojson; }
        expires 7d;
        add_header Cache-Control "public";
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "credentialless";
    }

    # Cache static assets
    location ~* \.(js|css|wasm|json|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "credentialless";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
