<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Infrastructures: Zürich — Weekend 1 Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #080808;
      color: #b0b0b0;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 { color: #e0e0e0; font-size: 15px; letter-spacing: 2px; margin-bottom: 2px; }
    h2 { color: #444; font-size: 11px; margin-bottom: 14px; font-weight: normal; letter-spacing: 1px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .card { background: #111; border: 1px solid #1e1e1e; padding: 10px 12px; }
    .card-label { color: #444; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .card-value { color: #00e87a; font-size: 15px; }
    .card-value.alert { color: #ff6b35; }

    .buttons { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      background: #111;
      color: #888;
      border: 1px solid #2a2a2a;
      padding: 8px 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: border-color 0.15s, color 0.15s;
    }
    button:hover:not(:disabled) { border-color: #555; color: #ccc; }
    button:disabled { color: #333; border-color: #1a1a1a; cursor: not-allowed; }
    button.active { border-color: #00e87a; color: #00e87a; }

    #log {
      background: #050505;
      border: 1px solid #161616;
      height: 320px;
      overflow-y: auto;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.7;
    }
    .ll   { color: #383838; }
    .lt   { color: #666; }
    .ltrg { color: #ff6b35; font-weight: bold; }
    .lerr { color: #ff4444; }
    .linf { color: #4a90e2; }
    .lok  { color: #00e87a; }
  </style>
</head>
<body>

  <h1>HIDDEN INFRASTRUCTURES: ZÜRICH</h1>
  <h2>weekend 1 — stub engines → mercator → web audio pipeline test</h2>

  <div class="cards">
    <div class="card">
      <div class="card-label">Listener Position</div>
      <div class="card-value" id="card-pos">—</div>
    </div>
    <div class="card">
      <div class="card-label">Trams within 150m</div>
      <div class="card-value" id="card-trams">—</div>
    </div>
    <div class="card">
      <div class="card-label">Nearest Feeder Dist</div>
      <div class="card-value" id="card-feeder">—</div>
    </div>
  </div>

  <div class="buttons">
    <button id="btn-audio">Unlock Audio</button>
    <button id="btn-start" disabled>Start</button>
    <button id="btn-stop" disabled>Stop</button>
  </div>

  <div id="log"></div>

  <script type="module">

    // ── CONSTANTS ────────────────────────────────────────────────────────────
    const REF_LAT = 47.3664;  // Stadelhofen reference origin
    const REF_LNG = 8.5483;
    const R = 6371000;        // Earth radius in metres

    const FEEDER_TRIGGER_M   = 30;   // tram within 30m of feeder → bang
    const TRAM_COUNT_RADIUS_M = 150; // trams within 150m of listener → count
    const TICK_MS      = 1000;
    const TICKS_PER_STEP = 5;       // listener advances one waypoint every 5 ticks

    // ── MERCATOR PROJECTION ──────────────────────────────────────────────────
    // Converts WGS-84 lat/lng to world-space metres relative to Stadelhofen.
    // +x = east, -z = north (Three.js convention, kept for Phase 1 PannerNode).
    function latLngTo3D(lat, lng) {
      const x = (lng - REF_LNG) * Math.cos(REF_LAT * Math.PI / 180) * R * (Math.PI / 180);
      const z = -(lat - REF_LAT) * R * (Math.PI / 180);
      return { x, y: 0, z };
    }

    // ── HAVERSINE DISTANCE ───────────────────────────────────────────────────
    function haversine(lat1, lng1, lat2, lng2) {
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2
              + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
              * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ── STUB DATA ────────────────────────────────────────────────────────────
    // Stub feeder positions (stand-ins for the 366 VBZ feeders in real data)
    const FEEDERS = [
      { id: 'F-stadelhofen', lat: 47.3664, lng: 8.5483 },
      { id: 'F-bellevue',    lat: 47.3667, lng: 8.5444 },
      { id: 'F-paradeplatz', lat: 47.3699, lng: 8.5388 },
    ];

    // 4 waypoints along Stadelhofen → Paradeplatz prototype route
    const WAYPOINTS = [
      { label: 'Stadelhofen', lat: 47.3664, lng: 8.5483 },
      { label: 'Bellevue',    lat: 47.3667, lng: 8.5444 },
      { label: 'Paradeplatz', lat: 47.3699, lng: 8.5388 },
      { label: 'Rennweg',     lat: 47.3727, lng: 8.5362 },
    ];

    // Spatial audio: PannerNode (Web Audio API) — Phase 1

    // ── WEB AUDIO SYNTHESIS ──────────────────────────────────────────────────

    // Noise burst: highpass-filtered white noise with fast attack/decay envelope.
    // Called once per feeder trigger event.
    function triggerCrackle(ctx) {
      const bufferSize = Math.floor(ctx.sampleRate * 0.1); // 100ms of noise
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const source = ctx.createBufferSource();
      source.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1000;

      const gain = ctx.createGain();
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(1, t + 0.002);       // 2ms attack
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.082); // 80ms decay

      source.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      source.start();
      source.stop(t + 0.1);
    }

    // Two detuned oscillators (220 + 221 Hz) with amplitude driven by tram count.
    // Called once on unlock; returns the GainNode so gain can be updated each tick.
    function startDrone(ctx, tramCount, distance) {
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      osc1.frequency.value = 220;
      osc2.frequency.value = 221;

      const gain = ctx.createGain();
      gain.gain.value = tramCount / 5 + 0.1;

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      osc1.start();
      osc2.start();

      return gain;
    }

    // ── STATE ────────────────────────────────────────────────────────────────
    let ctx        = null;
    let droneGain  = null;
    let loopTimer  = null;
    let tick       = 0;
    let listenerIdx = 0;
    let tickCount  = 0;  // ticks since last waypoint advance

    // ── UI HELPERS ───────────────────────────────────────────────────────────
    const logDiv = document.getElementById('log');

    function appendLog(text, cls = 'll') {
      const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const el = document.createElement('div');
      el.className = cls;
      el.textContent = `[${ts}] ${text}`;
      logDiv.appendChild(el);
      if (logDiv.children.length > 500) logDiv.removeChild(logDiv.firstChild);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setCard(id, value, alert = false) {
      const el = document.getElementById(id);
      el.textContent = value;
      el.className = `card-value${alert ? ' alert' : ''}`;
    }

    // ── MAIN LOOP ─────────────────────────────────────────────────────────────
    function step() {
      tick++;
      tickCount++;

      if (tickCount >= TICKS_PER_STEP) {
        listenerIdx = (listenerIdx + 1) % WAYPOINTS.length;
        tickCount = 0;
      }

      const listenerPos = WAYPOINTS[listenerIdx];
      const tramPos     = WAYPOINTS[(listenerIdx + 1) % WAYPOINTS.length];

      const listener3D = latLngTo3D(listenerPos.lat, listenerPos.lng);
      const tram3D     = latLngTo3D(tramPos.lat, tramPos.lng);

      let feederTriggered   = false;
      let nearestFeederDist = Infinity;
      let triggeredFeeder   = null;

      for (const feeder of FEEDERS) {
        const dist = haversine(tramPos.lat, tramPos.lng, feeder.lat, feeder.lng);
        if (dist < nearestFeederDist) nearestFeederDist = dist;
        if (dist < FEEDER_TRIGGER_M && !feederTriggered) {
          feederTriggered = true;
          triggeredFeeder = feeder.id;
        }
      }

      const tramDist  = haversine(listenerPos.lat, listenerPos.lng, tramPos.lat, tramPos.lng);
      const tramCount = tramDist < TRAM_COUNT_RADIUS_M ? 1 : 0;

      // ── Audio ──
      if (ctx) {
        if (feederTriggered) triggerCrackle(ctx);
        if (droneGain) droneGain.gain.value = tramCount / 5 + 0.1;
      }

      // ── UI cards ──
      setCard('card-pos',    `${listenerPos.lat.toFixed(4)}, ${listenerPos.lng.toFixed(4)}`);
      setCard('card-trams',  String(tramCount), tramCount > 0);
      setCard('card-feeder', `${Math.round(nearestFeederDist)}m`, feederTriggered);

      console.log({
        tick, listenerPos, listener3D, tramPos, tram3D,
        tramCount, nearestDist: Math.round(tramDist), feederTriggered,
      });

      if (feederTriggered) {
        appendLog(
          `TICK ${tick.toString().padStart(3)} | ⚡ FEEDER TRIGGER (${triggeredFeeder}) | trams:${tramCount} | dist:${Math.round(nearestFeederDist)}m`,
          'ltrg',
        );
      } else {
        appendLog(
          `TICK ${tick.toString().padStart(3)} | ${listenerPos.label} → ${tramPos.label} | trams:${tramCount} | nearest:${Math.round(tramDist)}m`,
          'lt',
        );
      }
    }

    // ── BUTTONS ──────────────────────────────────────────────────────────────
    const btnAudio = document.getElementById('btn-audio');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');

    btnAudio.addEventListener('click', async () => {
      btnAudio.disabled = true;
      btnAudio.textContent = 'Loading…';
      try {
        ctx = new AudioContext();
        if (ctx.state === 'suspended') await ctx.resume();
        appendLog(`AudioContext running (${ctx.sampleRate} Hz)`, 'linf');

        droneGain = startDrone(ctx, 0, 999);
        appendLog('Drone oscillators started (220 + 221 Hz)', 'lok');

        btnAudio.textContent = 'Audio Active';
        btnAudio.classList.add('active');
        btnStart.disabled = false;
      } catch (e) {
        appendLog(`ERROR: ${e.message}`, 'lerr');
        console.error(e);
        btnAudio.disabled = false;
        btnAudio.textContent = 'Unlock Audio';
      }
    });

    btnStart.addEventListener('click', () => {
      if (loopTimer) return;
      loopTimer = setInterval(step, TICK_MS);
      btnStart.disabled = true;
      btnStart.classList.add('active');
      btnStop.disabled = false;
      appendLog('Simulation started (1 s tick)', 'lok');
    });

    btnStop.addEventListener('click', () => {
      clearInterval(loopTimer);
      loopTimer = null;
      btnStart.disabled = false;
      btnStart.classList.remove('active');
      btnStop.disabled = true;
      appendLog('Simulation stopped', 'linf');
    });

    // ── STARTUP ───────────────────────────────────────────────────────────────
    appendLog(`Ref origin: Stadelhofen (${REF_LAT}, ${REF_LNG})`, 'linf');
    appendLog(`Feeders: ${FEEDERS.length} stubs | Waypoints: ${WAYPOINTS.length}`, 'linf');
    appendLog(`Feeder trigger: ${FEEDER_TRIGGER_M}m | Tram count radius: ${TRAM_COUNT_RADIUS_M}m`, 'linf');
    appendLog('Unlock Audio → Start to begin pipeline test.', 'll');
  </script>
</body>
</html>
